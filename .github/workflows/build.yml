name: Build R1 patcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patcher/**'
      - 'go.mod'
      - 'build_windows.bat'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Build Windows x64 patcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -ldflags="-s -w" -o OverTheHedge_Patcher_R1.exe ./patcher

      - name: Print SHA-256
        run: |
          sha256sum OverTheHedge_Patcher_R1.exe
          sha256sum patcher/over_the_hedge_r1.rtdp1.zlib.b64

      - name: Upload patcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverTheHedge_Patcher_R1
          path: OverTheHedge_Patcher_R1.exe
          if-no-files-found: error
